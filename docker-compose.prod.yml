version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aitutor-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitutor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aitutor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aitutor-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: aitutor-backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aitutor}:${POSTGRES_PASSWORD:-aitutor_secret}@postgres:5432/${POSTGRES_DB:-aitutor}?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aitutor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: aitutor-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - aitutor-net

  nginx:
    image: nginx:alpine
    container_name: aitutor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aitutor-net

volumes:
  postgres-data:

networks:
  aitutor-net:
    driver: bridge
