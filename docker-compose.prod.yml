name: aitutor

services:
  postgres:
    image: postgres:16-alpine
    container_name: aitutor-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitutor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aitutor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aitutor-net

  backend:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    container_name: aitutor-backend
    restart: always
    env_file:
      - .env
      - path: ./python_backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aitutor}:${POSTGRES_PASSWORD:-aitutor_secret}@postgres:5432/${POSTGRES_DB:-aitutor}?schema=public
      NODE_ENV: production
      ROOM_FINDER_JAVA_URL: ${ROOM_FINDER_JAVA_URL_DOCKER:-http://host.docker.internal:3333}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python_backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aitutor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: aitutor-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aitutor-net

  nginx:
    image: nginx:alpine
    container_name: aitutor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aitutor-net

volumes:
  postgres-data:

networks:
  aitutor-net:
    driver: bridge
