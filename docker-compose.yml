version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aitutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aitutor
      POSTGRES_PASSWORD: aitutor_secret
      POSTGRES_DB: aitutor
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitutor-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aitutor:aitutor_secret@postgres:5432/aitutor?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitutor-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres-data:
