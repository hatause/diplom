server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Unhashed lab scripts must revalidate after deployments. Keep their directory
    # separate from the React /pc-lab route so direct visits use the app shell.
    location ^~ /pc-lab-assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /pc-lab-viewer.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
